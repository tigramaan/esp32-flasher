name: Bug report
description: Report a reproducible ESP32 Flasher problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private firmware, keys, or device secrets. Operation logs can contain local paths; review them before sharing.
  - type: input
    id: version
    attributes:
      label: ESP32 Flasher version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - Single-BIN update
        - PlatformIO factory flash
        - Standalone UART monitor
        - Application startup or UI
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact user actions, COM port state, and result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Error code and diagnostics
      description: Include the stable error code and relevant sanitized log lines.
