name: ESP32 Flasher Windows portable

on:
  push:
    branches: [main, "001-esp32-programmer"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
      HAS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend
        run: |
          npm audit
          npm test
          npm run build
          npm run check:site

      - name: Verify Rust
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify fixtures and traceability
        shell: pwsh
        run: |
          tools\test-fixtures\generate.ps1 -Verify
          tools\traceability\verify.ps1

      - name: Build portable executable
        run: npm run build:portable

      - name: Build firmware packager
        run: cargo build --release -p programmer-pack

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item -LiteralPath 'target\release\ESP32 Flasher.exe' -Destination artifact\ESP32-Flasher-Windows-x64.exe
          Copy-Item -LiteralPath target\release\programmer-pack.exe -Destination artifact\programmer-pack.exe

      - name: Authenticode sign when certificate is configured
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'programmer-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\' |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          Get-ChildItem artifact -Filter *.exe | ForEach-Object {
            & $signTool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $_.FullName
          }
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Verify signature when configured
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          Get-ChildItem artifact -Filter *.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode status for $($_.Name): $($signature.Status)" }
          }

      - name: Create checksum
        shell: pwsh
        run: |
          Get-ChildItem artifact -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "$($_.FullName).sha256" -Value "$hash  $($_.Name)" -Encoding utf8NoBOM
          }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-flasher-windows-x64
          path: artifact/*
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            artifact/ESP32-Flasher-Windows-x64.exe
            artifact/ESP32-Flasher-Windows-x64.exe.sha256
