[workspace]
members = [
  "crates/programmer-core",
  "src-tauri",
  "tools/firmware-packager",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tigramaan/esp32-flasher"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
